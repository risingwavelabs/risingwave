steps:
  - label: "ARM ThinLTO: bisect measured RSS increase"
    key: arm-thinlto-bisect
    command: ci/scripts/arm-bisect/run.sh
    env:
      BISECT_METRIC: peak-rss
    timeout_in_minutes: 300
    agents:
      queue: linux-arm64
      "aws:instance-type": c7g.8xlarge
    plugins:
      - seek-oss/aws-sm#v2.3.2:
          env:
            GHCR_USERNAME: ghcr-username
            GHCR_TOKEN: ghcr-token
