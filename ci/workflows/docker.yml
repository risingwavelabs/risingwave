steps:
  - label: "ARM OOM experiment: production, jobs=8, 64 GiB"
    key: arm-oom-diagnostics
    command: ci/scripts/arm-oom/run.sh
    timeout_in_minutes: 120
    agents:
      queue: linux-arm64
      "aws:instance-type": c7g.8xlarge
    plugins:
      - seek-oss/aws-sm#v2.3.2:
          env:
            GHCR_USERNAME: ghcr-username
            GHCR_TOKEN: ghcr-token
