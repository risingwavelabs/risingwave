# configs for oracle connector
connector.class=io.debezium.connector.oracle.OracleConnector
# default snapshot mode to initial
snapshot.mode=${debezium.snapshot.mode:-initial}
snapshot.locking.mode=none
database.hostname=${hostname}
database.port=${port}
database.user=${username}
database.password=${password}
# Oracle CDB/service name and pluggable database name
database.dbname=${database.name}
database.pdb.name=${database.pdb.name}
# Let LogMiner buffer transactions and emit committed changes.
database.connection.adapter=logminer_unbuffered
log.mining.strategy=${debezium.log.mining.strategy:-online_catalog}
# default heartbeat interval 60 seconds
heartbeat.interval.ms=${debezium.heartbeat.interval.ms:-60000}
table.include.list=${schema.name}.${table.name:-*}
# only read table schema of the captured tables
schema.history.internal.store.only.captured.tables.ddl=true
schema.history.internal.store.only.captured.databases.ddl=true
# default to disable schema change events
include.schema.changes=${debezium.include.schema.changes:-false}
# In sharing CDC source mode, table filtering is removed by DbzConnectorConfig.
name=${hostname}:${port}:${database.name}.${database.pdb.name}.${schema.name}.${table.name:-RW_CDC_Sharing}
provide.transaction.metadata=${transactional:-false}
# Mine LOB writes so changed CLOB/BLOB/XML values are emitted. Unchanged LOB columns carry the
# placeholder below, which the backend replaces with the stored value through string comparison,
# so this placeholder is not allowed to be set by users.
lob.enabled=true
unavailable.value.placeholder=__debezium_unavailable_value
