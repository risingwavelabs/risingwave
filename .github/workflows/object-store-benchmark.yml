name: Object-store benchmark tests

on:
  pull_request:
    paths:
      - "scripts/bench/**"
      - ".github/workflows/object-store-benchmark.yml"
  push:
    branches: [main]
    paths:
      - "scripts/bench/**"
      - ".github/workflows/object-store-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned SDK dependencies
        run: python -m pip install -r scripts/bench/object_store_benchmark.requirements.txt
      - name: Test workload semantics and error handling
        run: python -m unittest discover -s scripts/bench -p 'test_*.py'
      - name: Check standalone entry point
        run: python scripts/bench/object_store_benchmark.py --help
