name: Push Docker Image to Docker Hub

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing ghcr.io/risingwavelabs/risingwave image tag"
        required: true
        type: string
      target_image_tag:
        description: "Docker Hub image tag (defaults to the existing GHCR tag)"
        required: false
        type: string

jobs:
  push_dockerhub:
    runs-on: ubuntu-latest
    steps:
      - name: Validate image tags
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_TARGET_IMAGE_TAG: ${{ inputs.target_image_tag }}
        run: |
          validate_image_tag() {
            local tag="$1"
            local input_name="$2"

            if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "Invalid $input_name: $tag"
              exit 1
            fi
          }

          validate_image_tag "$INPUT_IMAGE_TAG" "image_tag"
          target_image_tag="${INPUT_TARGET_IMAGE_TAG:-$INPUT_IMAGE_TAG}"
          validate_image_tag "$target_image_tag" "target_image_tag"

          echo "IMAGE_TAG=$INPUT_IMAGE_TAG" >> "$GITHUB_ENV"
          echo "TARGET_IMAGE_TAG=$target_image_tag" >> "$GITHUB_ENV"

      - name: Trigger Docker pipeline via Buildkite
        id: trigger_docker
        uses: buildkite/trigger-pipeline-action@v2.3.0
        with:
          buildkite_api_access_token: ${{ secrets.BUILDKITE_TOKEN }}
          pipeline: "risingwavelabs/docker"
          branch: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          message: ":github: Push existing GHCR image to Docker Hub: ${{ env.IMAGE_TAG }}"
          build_env_vars: '{ "PUSH_EXISTING_IMAGE_TO_DOCKERHUB": "true", "IMAGE_TAG": "${{ env.IMAGE_TAG }}", "TARGET_IMAGE_TAG": "${{ env.TARGET_IMAGE_TAG }}" }'

      - name: Summarize Buildkite build
        if: ${{ always() }}
        env:
          DOCKER_BUILD_URL: ${{ steps.trigger_docker.outputs.url }}
        run: |
          if [[ -n "$DOCKER_BUILD_URL" ]]; then
            echo "- [Docker promotion build]($DOCKER_BUILD_URL)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Docker promotion build: URL unavailable (trigger failed before returning one)." >> "$GITHUB_STEP_SUMMARY"
          fi
