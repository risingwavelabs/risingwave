- name: A range with one side bounded ends right before the NULLs, so IS NULL extends it.
  before:
  - create_table_and_mv
  sql: |
    SELECT * FROM orders_count_by_user WHERE user_id is null or user_id > 10;
  batch_plan: |-
    BatchExchange { order: [], dist: Single }
    └─BatchScan { table: orders_count_by_user, columns: [orders_count_by_user.user_id, orders_count_by_user.date, orders_count_by_user.orders_count], scan_ranges: [orders_count_by_user.user_id > Int64(10) AND orders_count_by_user.user_id <= null], distribution: UpstreamHashShard(orders_count_by_user.user_id, orders_count_by_user.date) }
- name: A bound on a shorter pk prefix covers all the keys extending it.
  sql: |
    create table t(a int, b int, primary key(a, b));
    select * from t where (a, b) > (1, 5) or a >= 1;
  batch_plan: |-
    BatchExchange { order: [], dist: Single }
    └─BatchScan { table: t, columns: [t.a, t.b], scan_ranges: [t.a >= Int32(1)], distribution: UpstreamHashShard(t.a, t.b) }
- name: The full range of a small integer type is not split into points.
  sql: |
    create table t(a smallint primary key);
    select * from t where a between -32768 and 32767;
  batch_plan: |-
    BatchExchange { order: [], dist: Single }
    └─BatchScan { table: t, columns: [t.a], scan_ranges: [t.a >= Int16(-32768) AND t.a <= Int16(32767)], distribution: UpstreamHashShard(t.a) }
- name: A NULL field in a row must not produce an empty range between overlapping arms.
  sql: |
    create table t(a int primary key, b int, c int);
    select * from t where a is null or (a, b) > (null::int, 0) or (a is null and c > 0);
  batch_plan: |-
    BatchExchange { order: [], dist: Single }
    └─BatchFilter { predicate: ((IsNull(t.a) OR RowGreaterThan(Row(t.a, t.b), '(,0)':Struct(Int32, Int32))) OR (IsNull(t.a) AND (t.c > 0:Int32))) }
      └─BatchScan { table: t, columns: [t.a, t.b, t.c], scan_ranges: [t.a IS NULL], distribution: UpstreamHashShard(t.a) }
- name: A contradiction in an OR arm does not widen the scan.
  sql: |
    create table t(a int primary key, b int);
    select * from t where (a > 5 and a < 3) or a = 1;
  batch_plan: |-
    BatchExchange { order: [], dist: Single }
    └─BatchScan { table: t, columns: [t.a, t.b], scan_ranges: [t.a = Int32(1)], distribution: UpstreamHashShard(t.a) }
- name: The union of a row comparison and a part of it is exact, so there is no filter.
  sql: |
    create table t(a int, b int, primary key(a, b));
    select * from t where (a, b) > (1, 5) or a = 1;
  batch_plan: |-
    BatchExchange { order: [], dist: Single }
    └─BatchScan { table: t, columns: [t.a, t.b], scan_ranges: [t.a >= Int32(1)], distribution: UpstreamHashShard(t.a, t.b) }
- name: Both arms cover all non-NULL values, and the NULLs stay out.
  sql: |
    create table t(a int, b int, primary key(a, b));
    select * from t where (a, b) < (7, 1) or (a, b) > (6, 7);
  batch_plan: |-
    BatchExchange { order: [], dist: Single }
    └─BatchScan { table: t, columns: [t.a, t.b], scan_ranges: [t.a < null], distribution: UpstreamHashShard(t.a, t.b) }
- name: A NULL in the first field of a row comparison selects nothing.
  sql: |
    create table t(a int, b int, primary key(a, b));
    select * from t where (a, b) > (null::int, 1) or a = 1;
  batch_plan: |-
    BatchExchange { order: [], dist: Single }
    └─BatchScan { table: t, columns: [t.a, t.b], scan_ranges: [t.a = Int32(1)], distribution: UpstreamHashShard(t.a, t.b) }
- name: Later columns narrow every value of an IN list.
  sql: |
    create table t(a int, b int, c int, primary key(a, b));
    select * from t where a in (1, 2) and b > 5;
  batch_plan: |-
    BatchExchange { order: [], dist: Single }
    └─BatchScan { table: t, columns: [t.a, t.b, t.c], scan_ranges: [t.a = Int32(1) AND t.b > Int32(5), t.a = Int32(2) AND t.b > Int32(5)], distribution: UpstreamHashShard(t.a, t.b) }
- sql: |
    create table t(a int, b int, c int, primary key(a, b));
    select * from t where a in (1, 2) and b in (3, 4);
  batch_plan: |-
    BatchExchange { order: [], dist: Single }
    └─BatchScan { table: t, columns: [t.a, t.b, t.c], scan_ranges: [t.a = Int32(1) AND t.b = Int32(3), t.a = Int32(1) AND t.b = Int32(4), t.a = Int32(2) AND t.b = Int32(3), t.a = Int32(2) AND t.b = Int32(4)], distribution: UpstreamHashShard(t.a, t.b) }
- name: A row comparison after an equality on the pk prefix.
  sql: |
    create table t(a int, b int, c int, d int, primary key(a, b, c));
    select * from t where a = 1 and (b, c) > (2, 3);
  batch_plan: |-
    BatchExchange { order: [], dist: Single }
    └─BatchScan { table: t, columns: [t.a, t.b, t.c, t.d], scan_ranges: [t.a = Int32(1) AND t.b = Int32(2) AND t.c > Int32(3), t.a = Int32(1) AND t.b > Int32(2)], distribution: UpstreamHashShard(t.a, t.b, t.c) }
- name: A row comparison on a mixed order pk is two exact ranges.
  sql: |
    create table t(a int, b int, c int);
    create materialized view mv as select * from t order by a, b desc;
    select * from mv where (a, b) > (1, 5);
  batch_plan: |-
    BatchExchange { order: [], dist: Single }
    └─BatchScan { table: mv, columns: [mv.a, mv.b, mv.c], scan_ranges: [mv.a = Int32(1) AND mv.b > Int32(5), mv.a > Int32(1)], distribution: SomeShard }
- name: Row comparisons with non-strict operators and BETWEEN get ranges too.
  sql: |
    create table t(a int, b int, primary key(a, b));
    select * from t where (a, b) between (1, 2) and (3, 4);
  batch_plan: |-
    BatchExchange { order: [], dist: Single }
    └─BatchScan { table: t, columns: [t.a, t.b], scan_ranges: [t.a = Int32(1) AND t.b >= Int32(2), t.a > Int32(1) AND (t.a, t.b) <= (Int32(3), Int32(4))], distribution: UpstreamHashShard(t.a, t.b) }
