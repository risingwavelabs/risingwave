- name: eowc agg grouped by columns derived from both keys of a join, whose keys share a column
  sql: |
    create table t (
      foo int,
      ts timestamp,
      watermark for ts as ts - interval '5 minutes'
    ) append only;
    select
      date_trunc('minute', t1.ts) as m1, date_trunc('minute', t2.ts) as m2, count(*) as cnt
    from t as t1 join (select ts, ts + interval '1 minute' as ts2 from t) as t2
      on t1.ts = t2.ts and t1.ts = t2.ts2
    group by 1, 2;
  eowc_stream_plan: |-
    StreamMaterialize { columns: [m1, m2, cnt], stream_key: [m1, m2], pk_columns: [m1, m2], pk_conflict: NoCheck, watermark_columns: [m1] }
