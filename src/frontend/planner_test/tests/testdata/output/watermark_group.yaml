      └─StreamExchange { dist: HashShard($expr2, $expr3) }
        └─StreamProject { exprs: [DateTrunc('minute':Varchar, t.ts) as $expr2, DateTrunc('minute':Varchar, t.ts) as $expr3, t._row_id, t._row_id, t.ts], output_watermarks: [[$expr2, $expr3, t.ts]] }
          └─StreamHashJoin [window, append_only] { type: Inner, predicate: t.ts = t.ts AND t.ts = $expr1, conditions_to_clean_state_in_join_key: [(t.ts = t.ts)], output_watermarks: [[t.ts, t.ts]], output: [t.ts, t.ts, t._row_id, t._row_id] }
            ├─StreamExchange { dist: HashShard(t.ts, t.ts) }
            │ └─StreamTableScan { table: t, columns: [t.ts, t._row_id], stream_scan_type: SnapshotBackfill, stream_key: [t._row_id], pk: [_row_id], dist: UpstreamHashShard(t._row_id) }
            └─StreamExchange { dist: HashShard(t.ts, $expr1) }
