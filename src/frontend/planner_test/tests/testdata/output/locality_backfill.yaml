        ├─StreamExchange { dist: HashShard(s.a) }
        │ └─StreamLocalityProvider { locality_columns: [s.a, s.b] }
        │   └─StreamExchange { dist: HashShard(s.a) }
        │     └─StreamTableScan { table: s, columns: [s.a, s.b, s.c, s._row_id], stream_scan_type: ArrangementBackfill, stream_key: [s._row_id], pk: [_row_id], dist: UpstreamHashShard(s._row_id) }
        └─StreamExchange [no_shuffle] { dist: UpstreamHashShard(idx.a) }
          └─StreamTableScan { table: idx, columns: [idx.a, idx.b, idx.c, idx.d.id], stream_scan_type: UpstreamOnly, stream_key: [idx.a, idx.d.id], pk: [a, b, d.id], dist: UpstreamHashShard(idx.a) }
