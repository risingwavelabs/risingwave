    create index i_c on c(x, abs(x)) include (id);
    create table b (b1 int, b2 int);
    create index i_b1 on b(b1);
    select a.a2, c.v, b.b2 from a join c on a.a1 = c.x join b on c.x = b.b1;
  stream_plan: |-
    StreamMaterialize { columns: [a2, v, b2, i_a1.a1(hidden), i_a1.a._row_id(hidden), c.id(hidden), c.x(hidden), i_b1.b1(hidden), i_b1.b._row_id(hidden)], stream_key: [i_a1.a1, i_a1.a._row_id, c.id, i_b1.b._row_id, c.x], pk_columns: [i_a1.a1, i_a1.a._row_id, c.id, i_b1.b._row_id, c.x], pk_conflict: NoCheck }
    └─StreamExchange { dist: HashShard(i_a1.a1, i_a1.a._row_id, c.id, c.x, i_b1.b._row_id) }
      └─StreamHashJoin { type: Inner, predicate: c.x = i_b1.b1, output: [i_a1.a2, c.v, i_b1.b2, i_a1.a1, i_a1.a._row_id, c.id, c.x, i_b1.b1, i_b1.b._row_id] }
