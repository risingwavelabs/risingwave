    StreamMaterialize { columns: [a2, v, i_a1.a1(hidden), i_a1.a._row_id(hidden), c.id(hidden)], stream_key: [i_a1.a1, i_a1.a._row_id, c.id], pk_columns: [i_a1.a1, i_a1.a._row_id, c.id], pk_conflict: NoCheck }
