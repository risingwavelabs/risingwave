- name: delta join does not use an index that lacks a column of the scan
  sql: |
    set rw_streaming_enable_delta_join = true;
    set streaming_use_snapshot_backfill = false;
    create table a (a1 int, a2 int);
    create index i_a1 on a(a1);
    create table c (id int primary key, x int, v int);
    /* `i_c` has as many columns as `c`, but not `v`. */
    create index i_c on c(x, abs(x)) include (id);
    select a.a2, c.v from a join c on a.a1 = c.x;
