        │ └─StreamHashJoin { type: Inner, predicate: i_a1.a1 = c.x, output: [i_a1.a2, c.x, c.v, i_a1.a1, i_a1.a._row_id, c.id] }
        │   ├─StreamExchange { dist: HashShard(i_a1.a1) }
        │   │ └─StreamTableScan { table: i_a1, columns: [i_a1.a1, i_a1.a2, i_a1.a._row_id], stream_scan_type: ArrangementBackfill, stream_key: [i_a1.a1, i_a1.a._row_id], pk: [a1, a._row_id], dist: UpstreamHashShard(i_a1.a1) }
        │   └─StreamExchange { dist: HashShard(c.x) }
        │     └─StreamTableScan { table: c, columns: [c.x, c.v, c.id], stream_scan_type: ArrangementBackfill, stream_key: [c.id], pk: [id], dist: UpstreamHashShard(c.id) }
        └─StreamExchange { dist: HashShard(i_b1.b1) }
          └─StreamTableScan { table: i_b1, columns: [i_b1.b1, i_b1.b2, i_b1.b._row_id], stream_scan_type: ArrangementBackfill, stream_key: [i_b1.b1, i_b1.b._row_id], pk: [b1, b._row_id], dist: UpstreamHashShard(i_b1.b1) }
- name: multi-way delta join does not use an index whose primary key is not in the scan output
  sql: |
    set rw_streaming_enable_delta_join = true;
    set streaming_use_snapshot_backfill = false;
    create table a (a1 int, a2 int);
    create index i_a1 on a(a1);
    create table b (b1 int, b2 int, b3 int);
    create index i_b1 on b(b1);
    /* the primary key of `i_b2` has `b3`, which the scan of `b` does not read */
    create index i_b2 on b(b2, b3);
    create table c (c1 int, c2 int);
    create index i_c1 on c(c1);
    select a.a2, b.b2, c.c2 from a join b on a.a1 = b.b1 join c on b.b2 = c.c1;
  stream_plan: |-
    StreamMaterialize { columns: [a2, b2, c2, i_a1.a1(hidden), i_a1.a._row_id(hidden), i_b1.b._row_id(hidden), i_c1.c1(hidden), i_c1.c._row_id(hidden)], stream_key: [i_a1.a1, i_a1.a._row_id, i_b1.b._row_id, i_c1.c._row_id, b2], pk_columns: [i_a1.a1, i_a1.a._row_id, i_b1.b._row_id, i_c1.c._row_id, b2], pk_conflict: NoCheck }
    └─StreamExchange { dist: HashShard(i_b1.b2, i_a1.a1, i_a1.a._row_id, i_b1.b._row_id, i_c1.c._row_id) }
      └─StreamHashJoin { type: Inner, predicate: i_b1.b2 = i_c1.c1, output: [i_a1.a2, i_b1.b2, i_c1.c2, i_a1.a1, i_a1.a._row_id, i_b1.b._row_id, i_c1.c1, i_c1.c._row_id] }
        ├─StreamExchange { dist: HashShard(i_b1.b2) }
        │ └─StreamDeltaJoin { type: Inner, predicate: i_a1.a1 = i_b1.b1, output: [i_a1.a2, i_b1.b2, i_a1.a1, i_a1.a._row_id, i_b1.b1, i_b1.b._row_id] }
        │   ├─StreamTableScan { table: i_a1, columns: [i_a1.a1, i_a1.a2, i_a1.a._row_id], stream_scan_type: ArrangementBackfill, stream_key: [i_a1.a1, i_a1.a._row_id], pk: [a1, a._row_id], dist: UpstreamHashShard(i_a1.a1) }
        │   └─StreamTableScan { table: i_b1, columns: [i_b1.b1, i_b1.b2, i_b1.b._row_id], stream_scan_type: UpstreamOnly, stream_key: [i_b1.b1, i_b1.b._row_id], pk: [b1, b._row_id], dist: UpstreamHashShard(i_b1.b1) }
        └─StreamExchange { dist: HashShard(i_c1.c1) }
          └─StreamTableScan { table: i_c1, columns: [i_c1.c1, i_c1.c2, i_c1.c._row_id], stream_scan_type: ArrangementBackfill, stream_key: [i_c1.c1, i_c1.c._row_id], pk: [c1, c._row_id], dist: UpstreamHashShard(i_c1.c1) }
- name: multi-way delta join backfills a leaf when the first input is the center of a star
  sql: |
    set rw_streaming_enable_delta_join = true;
    set streaming_use_snapshot_backfill = false;
    create table a (x int, y int, v int);
    create index i_a_x on a(x);
    create index i_a_y on a(y);
    create table b (x int, v int);
    create index i_b_x on b(x);
    create table c (y int, v int);
    create index i_c_y on c(y);
    /* the plan of `delta_join_multiway_backfill.slt`, where `b` is backfilled */
    select count(*) as n, sum(a.v) as sa, sum(b.v) as sb, sum(c.v) as sc
    from a join b on a.x = b.x join c on a.y = c.y;
  stream_plan: |-
    StreamMaterialize { columns: [n, sa, sb, sc], stream_key: [], pk_columns: [], pk_conflict: NoCheck }
    └─StreamProject { exprs: [sum0(count), Case((sum0(count(i_a_x.v)) = 0:Int64), null:Int64, sum(sum(i_a_x.v))) as $expr1, Case((sum0(count(i_b_x.v)) = 0:Int64), null:Int64, sum(sum(i_b_x.v))) as $expr2, Case((sum0(count(i_c_y.v)) = 0:Int64), null:Int64, sum(sum(i_c_y.v))) as $expr3] }
      └─StreamSimpleAgg [append_only] { aggs: [sum0(count), sum(sum(i_a_x.v)), sum(sum(i_b_x.v)), sum(sum(i_c_y.v)), sum0(count(i_a_x.v)), sum0(count(i_b_x.v)), sum0(count(i_c_y.v)), count] }
        └─StreamExchange { dist: Single }
          └─StreamStatelessSimpleAgg { aggs: [count, sum(i_a_x.v), sum(i_b_x.v), sum(i_c_y.v), count(i_a_x.v), count(i_b_x.v), count(i_c_y.v)] }
            └─StreamMultiwayDeltaJoin { type: Inner, predicate: i_a_x.x = i_b_x.x AND i_a_x.y = i_c_y.y, lookups: [i_c_y -> i_a_y -> i_b_x, i_a_x -> i_b_x -> i_c_y*, i_b_x -> i_a_x* -> i_c_y*], output: [i_a_x.v, i_b_x.v, i_c_y.v, i_a_x.x, i_a_x.a._row_id, i_b_x.b._row_id, i_a_x.y, i_c_y.y, i_c_y.c._row_id] }
              ├─StreamTableScan { table: i_a_x, columns: [i_a_x.x, i_a_x.y, i_a_x.v, i_a_x.a._row_id], stream_scan_type: UpstreamOnly, stream_key: [i_a_x.x, i_a_x.a._row_id], pk: [x, a._row_id], dist: UpstreamHashShard(i_a_x.x) }
              ├─StreamTableScan { table: i_c_y, columns: [i_c_y.y, i_c_y.v, i_c_y.c._row_id], stream_scan_type: UpstreamOnly, stream_key: [i_c_y.y, i_c_y.c._row_id], pk: [y, c._row_id], dist: UpstreamHashShard(i_c_y.y) }
              ├─StreamTableScan { table: i_b_x, columns: [i_b_x.x, i_b_x.v, i_b_x.b._row_id], stream_scan_type: ArrangementBackfill, stream_key: [i_b_x.x, i_b_x.b._row_id], pk: [x, b._row_id], dist: UpstreamHashShard(i_b_x.x) }
              └─StreamTableScan { table: i_a_y, columns: [i_a_y.x, i_a_y.y, i_a_y.v, i_a_y.a._row_id], stream_scan_type: UpstreamOnly, stream_key: [i_a_y.y, i_a_y.a._row_id], pk: [y, a._row_id], dist: UpstreamHashShard(i_a_y.y) }
