- name: constant expressions in questions are folded without inference
  sql: |
    SELECT ai_decide(NULL::jsonb, 'url', 'model',
      ai_questions(ai_prob_question('q', concat('Is ', 'resolved?'))), 'key');
  logical_plan: |-
    LogicalProject { exprs: [AiDecide(null:Jsonb, 'url':Varchar, 'model':Varchar, '{"q": {"instructions": "Is resolved?", "type": "noul"}}':Jsonb, "<redacted>") as $expr1] }
    └─LogicalValues { rows: [[]], schema: Schema { fields: [] } }
- name: dynamic questions are rejected
  sql: |
    CREATE TABLE contexts (state JSONB, questions JSONB);
    SELECT ai_decide(state, 'url', 'model', questions, 'key') FROM contexts;
  binder_error: |
    Failed to bind expression: ai_decide(state, 'url', 'model', questions, 'key')

    Caused by:
      Invalid input syntax: ai_decide questions must be constant
- name: dynamic question text is rejected
  sql: |
    CREATE TABLE contexts (state JSONB, prompt VARCHAR);
    SELECT ai_decide(state, 'url', 'model', ai_prob_question('q', prompt), 'key') FROM contexts;
  binder_error: |
    Failed to bind expression: ai_decide(state, 'url', 'model', ai_prob_question('q', prompt), 'key')

    Caused by:
      Invalid input syntax: question instructions must be constant
- name: duplicate question names are rejected
  sql: SELECT ai_questions(ai_prob_question('q', 'First?'), ai_prob_question('q', 'Second?'));
  binder_error: |
    Failed to bind expression: ai_questions(ai_prob_question('q', 'First?'), ai_prob_question('q', 'Second?'))

    Caused by:
      Invalid input syntax: ai_questions: duplicate question name "q"
- name: duplicate choice labels are rejected
  sql: SELECT ai_choice_question('q', 'Choose?', ARRAY[ai_option('a', 'First'), ai_option('a', 'Second')]);
  binder_error: |
    Failed to bind expression: ai_choice_question('q', 'Choose?', ARRAY[ai_option('a', 'First'), ai_option('a', 'Second')])

    Caused by:
      Invalid input syntax: question "q": duplicate choice label
- name: empty question set is rejected
  sql: SELECT ai_questions();
  binder_error: |
    Failed to bind expression: ai_questions()

    Caused by:
      Invalid input syntax: Invalid parameter ai_decide questions: expected a nonempty object of fixed question definitions
- name: invalid score rubric is rejected
  sql: SELECT ai_score_question('q', 'Rate?', ARRAY['Only one level']);
  binder_error: |
    Failed to bind expression: ai_score_question('q', 'Rate?', ARRAY['Only one level'])

    Caused by:
      Invalid input syntax: Invalid parameter ai_decide questions: question "q": score requires 2 to 10 ordered level descriptions
- name: null option label is rejected
  sql: SELECT ai_option(NULL, 'Description');
  binder_error: |
    Failed to bind expression: ai_option(NULL, 'Description')

    Caused by:
      Invalid input syntax: ai_option label must be a nonempty string
- name: question types must be supported
  sql: SELECT ai_decide(NULL::jsonb, 'url', 'model', '{"q":{"type":"text","instructions":"Explain?"}}'::jsonb, 'key');
  binder_error: |
