- id: create_tables_and_indexes
  sql: |
    create table logs (id bigint primary key, service varchar, message varchar, metadata jsonb);
    create index logs_message_fts on logs using fulltext (message);
    create index logs_metadata_fts on logs using fulltext (metadata);
    create index logs_error_fts on logs using fulltext ((metadata -> 'error' ->> 'message')) with (analyzer = 'simple');
    create index logs_spans_fts on logs using fulltext (jsonb_path_query_array(metadata, '$.spans[*].error'));
  expected_outputs: []
- id: explain_create_index_on_table
  sql: |
    create table logs (id bigint primary key, service varchar, message varchar, metadata jsonb);
    explain create index logs_message_fts on logs using fulltext (message) with (analyzer = 'simple');
  expected_outputs:
    - explain_output
- id: explain_create_index_on_jsonb_expression
  sql: |
    create table logs (id bigint primary key, service varchar, message varchar, metadata jsonb);
    explain create index logs_error_fts on logs using fulltext ((metadata -> 'error' ->> 'message'));
  expected_outputs:
    - explain_output
- id: explain_create_index_on_table_without_pk
  sql: |
    create table t (doc varchar) append only;
    explain create index t_doc_fts on t using fulltext (doc);
  expected_outputs:
    - explain_output
- id: explain_create_index_on_pk_column
  sql: |
    create table t (doc varchar primary key);
    explain create index t_doc_fts on t using fulltext (doc);
  expected_outputs:
    - explain_output
- id: explain_create_index_on_mv
  sql: |
    create table t (k int, doc varchar);
    create materialized view mv as select k, string_agg(doc, ' ') as docs from t group by k;
    explain create index mv_docs_fts on mv using fulltext (docs);
  expected_outputs:
    - explain_output
- id: create_index_wrong_type
  sql: |
    create table logs (id bigint primary key, message varchar);
    explain create index bad on logs using fulltext (id);
  expected_outputs:
    - planner_error
- id: create_index_multiple_columns
  sql: |
    create table logs (id bigint primary key, service varchar, message varchar);
    explain create index bad on logs using fulltext (service, message);
  expected_outputs:
    - planner_error
- id: create_index_with_include
  sql: |
    create table logs (id bigint primary key, service varchar, message varchar);
    explain create index bad on logs using fulltext (message) include (service);
  expected_outputs:
    - planner_error
- id: create_index_with_distributed_by
  sql: |
    create table logs (id bigint primary key, service varchar, message varchar);
    explain create index bad on logs using fulltext (message) distributed by (message);
  expected_outputs:
    - planner_error
- id: create_index_with_order
  sql: |
    create table logs (id bigint primary key, service varchar, message varchar);
    explain create index bad on logs using fulltext (message desc);
  expected_outputs:
    - planner_error
- id: create_index_unknown_analyzer
  sql: |
    create table logs (id bigint primary key, service varchar, message varchar);
    explain create index bad on logs using fulltext (message) with (analyzer = 'jieba');
  expected_outputs:
    - planner_error
- id: create_index_unknown_option
  sql: |
    create table logs (id bigint primary key, service varchar, message varchar);
    explain create index bad on logs using fulltext (message) with (distance_type = 'l2');
  expected_outputs:
    - planner_error
- id: search_with_other_filter
  before:
    - create_tables_and_indexes
  sql: |
    select id, message from logs where keyword_match(message, 'Connection timeout') and service = 'api';
  expected_outputs:
