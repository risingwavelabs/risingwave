- id: search_mv_index
  sql: |
    create table t (k int, doc varchar);
    create materialized view mv as select k, string_agg(doc, ' ') as docs from t group by k;
    create index mv_docs_fts on mv using fulltext (docs);
    select k from mv where keyword_match(docs, 'hello world');
  expected_outputs:
    - batch_plan
- id: search_table_without_pk
  sql: |
    create table t (v int, doc varchar) append only;
    create index t_doc_fts on t using fulltext (doc);
    select v, doc from t where keyword_match(doc, 'hello') limit 5;
  expected_outputs:
    - batch_plan
- id: vector_index_still_works_with_full_text_index
  sql: |
    create table items (id int primary key, name varchar, embedding vector(3)) append only;
    create index items_name_fts on items using fulltext (name);
    create index items_vector on items using flat (embedding) include (name) with (distance_type = 'l2');
    select id, name from items order by embedding <-> '[1, 2, 3]' limit 5;
  expected_outputs:
    - batch_plan
- id: limit_not_pushed_with_other_filter
  before:
  - create_tables_and_indexes
  sql: |
    select id from logs where keyword_match(message, 'timeout') and service = 'api' limit 10;
  expected_outputs:
    - batch_plan
- id: limit_with_offset_pushed
  before:
  - create_tables_and_indexes
  sql: |
    select id, message from logs where keyword_match(message, 'timeout') limit 10 offset 5;
  expected_outputs:
    - batch_plan
- id: limit_not_pushed_with_retention
  sql: |
    create table t (id bigint primary key, doc varchar) append only with (retention_seconds = 60);
    create index t_doc_fts on t using fulltext (doc);
    select id, doc from t where keyword_match(doc, 'timeout') limit 10;
  expected_outputs:
    - batch_plan
- id: limit_not_pushed_with_ttl_watermark
  sql: |
    create table t (
      id bigint primary key,
      ts timestamp,
      doc varchar,
      watermark for ts as ts - interval '1 minute' with ttl
    );
    create index t_doc_fts on t using fulltext (doc);
    select id, doc from t where keyword_match(doc, 'timeout') limit 10;
  expected_outputs:
    - batch_plan
- id: limit_not_pushed_through_join_with_other_table
  before:
  - create_tables_and_indexes
  sql: |
    create table services (id bigint primary key, name varchar);
    select s.name from (select id from logs where keyword_match(message, 'timeout')) l join services s on l.id = s.id limit 10;
  expected_outputs:
    - batch_plan
