      define a as a.v > 0, b as prev(b.v) in (select v from t)
    );
  expected_outputs:
    - binder_error
- name: MATCH_RECOGNIZE DEFINE navigation nested in IS DISTINCT FROM, LIKE, an array constructor and a subscript
  sql: |
    create table t(id int, ts int, v int, s varchar, watermark for ts as ts - 10) append only;
    select * from t match_recognize (
      partition by id
      order by ts
      measures a.v as m
      one row per match
      after match skip past last row
      pattern (a b)
      define a as a.v > 0,
             b as (prev(b.v) is distinct from b.v)
                  and (prev(s) like 'a%')
                  and ((array[prev(b.v, 2), last(a.v)])[1] < b.v)
    );
  expected_outputs:
    - eowc_stream_plan
