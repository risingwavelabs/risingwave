    select * from t match_recognize (
      partition by id
      order by ts
      measures a.v as m
      one row per match
      after match skip past last row
      pattern (permute(a, b, c, d, e, f, g, h))
      define a as a.v > 0, b as b.v < 0, c as c.v > 1, d as d.v > 2,
             e as e.v > 3, f as f.v > 4, g as g.v > 5, h as h.v > 6
    );
