- id: watermark ttl basic
  sql: |
    explain create table t (
      id int primary key,
      ts timestamp,
      watermark for ts as ts - interval '1 minute' with ttl
    );
  expected_outputs:
    - explain_output

- id: watermark ttl append-only pk
  sql: |
    explain create table t (
      id int primary key,
      ts timestamp,
      watermark for ts as ts - interval '1 minute' with ttl
    ) append only;
  expected_outputs:
    - explain_output

- id: watermark ttl non-append-only row-id
  sql: |
    explain create table t (
      id int,
      ts timestamp,
      watermark for ts as ts - interval '1 minute' with ttl
    );
  expected_outputs:
    - explain_output

- id: watermark ttl append-only row-id
  sql: |
    explain create table t (
      id int,
      ts timestamp,
      watermark for ts as ts - interval '1 minute' with ttl
    ) append only;
  expected_outputs:
    - explain_output

- id: watermark ttl append-only proctime generated column
  sql: |
    explain create table t (
      id int,
      proc_time timestamptz as proctime(),
      watermark for proc_time as proc_time with ttl
    ) append only;
  expected_outputs:
    - explain_output

- id: watermark ttl timestamptz with day interval
  sql: |
    explain create table t (
      id int primary key,
      max_event_time timestamptz,
      watermark for max_event_time as max_event_time - interval '7' day with ttl
    );
  expected_outputs:
    - explain_output

- id: watermark ttl scan keeps stream key columns
  sql: |
    create table t (
      v int,
      proc_time timestamptz as proctime(),
      watermark for proc_time as proc_time with ttl
    ) append only;
    select v from t;
  expected_outputs:
    - stream_plan
    - batch_plan

- id: watermark ttl on refreshable table with ttl column outside pk
  sql: |
    explain create table t (
      id int primary key,
      ts timestamp,
      watermark for ts as ts - interval '1 minute' with ttl
    ) with (
      connector = 's3',
      match_pattern = 'planner/*.csv',
      s3.region_name = 'custom',
      s3.bucket_name = 'hummock001',
      s3.credentials.access = 'hummockadmin',
      s3.credentials.secret = 'hummockadmin',
      s3.endpoint_url = 'http://127.0.0.1:9301',
      refresh_mode = 'FULL_RELOAD'
    ) FORMAT PLAIN ENCODE CSV (without_header = 'true', delimiter = ',');
  expected_outputs:
    - planner_error

- id: watermark ttl on refreshable table with ttl column in pk
  sql: |
    explain create table t (
      id int,
      ts timestamp,
      watermark for ts as ts - interval '1 minute' with ttl,
      primary key (id, ts)
    ) with (
      connector = 's3',
      match_pattern = 'planner/*.csv',
      s3.region_name = 'custom',
      s3.bucket_name = 'hummock001',
      s3.credentials.access = 'hummockadmin',
      s3.credentials.secret = 'hummockadmin',
      s3.endpoint_url = 'http://127.0.0.1:9301',
      refresh_mode = 'FULL_RELOAD'
    ) FORMAT PLAIN ENCODE CSV (without_header = 'true', delimiter = ',');
  expected_outputs:
    - planner_error
