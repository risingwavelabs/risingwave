- name: table with generated columns
  sql: |
    explain create table t1 (v1 int as v2-1, v2 int, v3 int as v2+1);
  expected_outputs:
  - explain_output
- name: source with generated columns
  sql: |
    create source s1 (v1 int as v2-1, v2 int, v3 int as v2+1) with (connector = 'kinesis') FORMAT PLAIN ENCODE JSON;
    select v3 from s1
  expected_outputs:
  - batch_plan
- name: select proctime()
  sql: |
    select proctime();
  expected_outputs:
  - binder_error
- name: proctime cast to with timezone
  sql: |
    explain create table t1 (proc_time TIMESTAMPTZ AS proctime());
  expected_outputs:
  - explain_output
- name: proctime cast to without timezone
  sql: |
    explain create table t1 (proc_time TIMESTAMP AS proctime());
  expected_outputs:
  - explain_output
- name: watermark on generated column
  sql: |
    explain create table t (v int, w int as v+1, watermark for w as w) append only
  expected_outputs:
  - explain_output
- name: NOT NULL on a generated column is checked on its computed value
  sql: |
    explain create table t (v int, g int not null as v + 1);
  expected_outputs:
  - explain_output
- name: NOT NULL on a column after a generated column checks that column
  sql: |
    explain create table t (g int as null::int, v int not null);
  expected_outputs:
  - explain_output
- name: sink into a table without a column list matches the columns after a generated column
  sql: |
    create table t (id int primary key, g int as id + 1, v int);
    create table s (id int primary key, v int);
    explain create sink sk into t as select id, v from s;
  expected_outputs:
  - explain_output
