- name: dynamic arguments and JSONB return type
  sql: |
    CREATE TABLE contexts (id INT, state JSONB, url VARCHAR, model VARCHAR, questions JSONB, api_key VARCHAR);
    SELECT id, jev_eval(state, url, model, questions, api_key) AS judgment FROM contexts;
  expected_outputs:
    - logical_plan
    - batch_plan
    - stream_plan
    - stream_dist_plan

- name: constants must not trigger inference during planning and key is redacted
  sql: |
    SELECT jev_eval('{"messages":["hello"]}'::jsonb, 'http://127.0.0.1:1/evaluate',
      'test-model', '{"q":{"type":"noul","instructions":"Resolved?"}}'::jsonb, 'planner-only-key');
  expected_outputs:
    - logical_plan
    - batch_plan
    - stream_plan

- name: nested expression materializes its old result
  sql: |
    CREATE TABLE contexts (id INT, state JSONB);
    SELECT id, coalesce(jev_eval(state, 'http://127.0.0.1:1/evaluate', 'test-model',
      '{}'::jsonb, 'planner-only-key')->'answers', '{}'::jsonb) AS answers FROM contexts;
  expected_outputs:
    - stream_plan

- name: grouped state is evaluated after aggregation
  sql: |
    CREATE TABLE events (user_id INT, seq INT, payload JSONB);
    SELECT user_id, jev_eval(jsonb_agg(payload ORDER BY seq),
      'http://127.0.0.1:1/evaluate', 'test-model', '{}'::jsonb, 'planner-only-key')
    FROM events GROUP BY user_id;
  expected_outputs:
    - batch_plan
    - stream_plan

- name: windowed group supports immediate and on-close emission
  sql: |
    CREATE TABLE events (user_id INT, ts TIMESTAMP, payload JSONB,
      WATERMARK FOR ts AS ts - INTERVAL '5 seconds') APPEND ONLY;
    SELECT user_id, window_start, jev_eval(jsonb_agg(payload ORDER BY ts),
      'http://127.0.0.1:1/evaluate', 'test-model', '{}'::jsonb, 'planner-only-key')
    FROM tumble(events, ts, INTERVAL '5 minutes') GROUP BY user_id, window_start;
  expected_outputs:
    - stream_plan
    - eowc_stream_plan

- name: OVER state is evaluated after the window for both emission modes
  sql: |
    CREATE TABLE events (user_id INT, ts TIMESTAMP, payload JSONB,
      WATERMARK FOR ts AS ts - INTERVAL '5 seconds') APPEND ONLY;
    SELECT user_id, ts, jev_eval(
      to_jsonb(array_agg(payload) OVER (PARTITION BY user_id ORDER BY ts ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)),
      'http://127.0.0.1:1/evaluate', 'test-model', '{}'::jsonb, 'planner-only-key')
    FROM events;
  expected_outputs:
    - batch_plan
    - stream_plan
    - eowc_stream_plan

- name: append-only projection does not require result storage
  sql: |
    CREATE TABLE contexts (state JSONB, questions JSONB) APPEND ONLY;
    SELECT jev_eval(state, 'http://127.0.0.1:1/evaluate', 'test-model', questions, 'planner-only-key') FROM contexts;
  expected_outputs:
    - stream_plan

- name: wrong arity is rejected
  sql: SELECT jev_eval('{}'::jsonb, 'url', '{}'::jsonb);
  expected_outputs:
    - binder_error

- name: wrong argument type is rejected
  sql: SELECT jev_eval(42, 'url', 'model', '{}'::jsonb, 'planner-only-key');
  expected_outputs:
    - binder_error

- name: SECRET support is deferred
  sql: SELECT jev_eval('{}'::jsonb, 'url', 'model', '{}'::jsonb, SECRET missing_key);
  expected_outputs:
    - binder_error

- name: legacy name binds to the canonical function
  sql: |
    CREATE TABLE contexts (id INT, state JSONB);
    SELECT jev_analyze(state, 'http://127.0.0.1:1/evaluate', 'test-model',
      '{}'::jsonb, 'planner-only-key') FROM contexts;
  expected_outputs:
    - logical_plan
    - stream_plan

- name: constant execution options preserve volatility and key redaction
  sql: |
    CREATE TABLE contexts (id INT, state JSONB);
    SELECT jev_eval(state, 'http://127.0.0.1:1/evaluate', 'test-model',
      '{}'::jsonb, 'planner-only-key', '{"max_concurrency":16}'::jsonb) FROM contexts;
  expected_outputs:
    - logical_plan
    - batch_plan
    - stream_plan

- name: options cannot depend on input rows
  sql: |
    CREATE TABLE contexts (state JSONB, options JSONB);
    SELECT jev_eval(state, 'url', 'model', '{}'::jsonb, 'planner-only-key', options) FROM contexts;
  expected_outputs:
    - binder_error

- name: zero concurrency is rejected before creating a job
  sql: SELECT jev_eval('{}'::jsonb, 'url', 'model', '{}'::jsonb, 'planner-only-key', '{"max_concurrency":0}'::jsonb);
  expected_outputs:
    - binder_error

- name: excessive concurrency is rejected
  sql: SELECT jev_eval('{}'::jsonb, 'url', 'model', '{}'::jsonb, 'planner-only-key', '{"max_concurrency":257}'::jsonb);
  expected_outputs:
    - binder_error

- name: unknown execution options are rejected
  sql: SELECT jev_eval('{}'::jsonb, 'url', 'model', '{}'::jsonb, 'planner-only-key', '{"private-unknown-option":1}'::jsonb);
  expected_outputs:
    - binder_error

- name: null options are rejected
  sql: SELECT jev_eval('{}'::jsonb, 'url', 'model', '{}'::jsonb, 'planner-only-key', NULL::jsonb);
  expected_outputs:
    - binder_error

- name: legacy alias also validates options
  sql: SELECT jev_analyze('{}'::jsonb, 'url', 'model', '{}'::jsonb, 'planner-only-key', '{"max_concurrency":-1}'::jsonb);
  expected_outputs:
    - binder_error
