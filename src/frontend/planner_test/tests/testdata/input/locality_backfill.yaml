- name: the provider replays rows in the order of the hash join state, which puts the eq keys with watermarks first.
  sql: |
    set enable_locality_backfill = true;
    set locality_backfill_mode = always;
    create table t1 (k int, ts timestamp, v int, watermark for ts as ts - interval '1' second) append only;
    create table t2 (k int, ts timestamp, v int, watermark for ts as ts - interval '1' second) append only;
    select t1.k, t1.ts, t1.v, t2.v as v2 from t1 join t2 on t1.k = t2.k and t1.ts = t2.ts;
  expected_outputs:
    - stream_plan
    - stream_dist_plan
- name: the provider replays rows in the order of the EOWC agg state, which puts the window column first.
  sql: |
    set enable_locality_backfill = true;
    set locality_backfill_mode = always;
    create table t (k int, ts timestamp, v int, watermark for ts as ts - interval '1' second) append only;
    select k, window_start, count(*) from tumble(t, ts, interval '1' minute) group by k, window_start;
  expected_outputs:
    - eowc_stream_plan
    - eowc_stream_dist_plan
- name: the provider replays rows in the order the temporal join looks up the table.
  sql: |
    set enable_locality_backfill = true;
    set locality_backfill_mode = always;
    create table s (a int, b int, c int);
    create table d (a int, b int, c int, primary key (a, b));
    select s.a, s.b, s.c, d.c as dc from s join d for system_time as of proctime() on s.b = d.b and s.a = d.a;
  expected_outputs:
    - stream_plan
    - stream_dist_plan
- name: no provider when the table is read in the lookup order of the temporal join.
  sql: |
    set enable_locality_backfill = true;
    set locality_backfill_mode = always;
    create table s (a int, b int, c int, primary key (a, b));
    create table d (a int, b int, c int, primary key (a, b));
    select s.a, s.b, s.c, d.c as dc from s join d for system_time as of proctime() on s.b = d.b and s.a = d.a;
  expected_outputs:
    - stream_plan
- name: a provider when the table is read in the written order but the join puts the watermark column first.
  sql: |
    set enable_locality_backfill = true;
    set locality_backfill_mode = always;
    create table t1 (k int, ts timestamp, v int, primary key (k, ts), watermark for ts as ts - interval '1' second with ttl);
    create table t2 (k int, ts timestamp, v int, primary key (k, ts), watermark for ts as ts - interval '1' second with ttl);
    select t1.k, t1.ts, t1.v, t2.v as v2 from t1 join t2 on t1.k = t2.k and t1.ts = t2.ts;
  expected_outputs:
    - stream_plan
- name: a provider between windowed aggs and the window join, which puts the window column first.
  sql: |
    set enable_locality_backfill = true;
    set locality_backfill_mode = always;
    create table t1 (k int, ts timestamp, watermark for ts as ts - interval '1' second) append only;
    create table t2 (k int, ts timestamp, watermark for ts as ts - interval '1' second) append only;
    select a.k, a.window_start, a.c, b.c as c2 from
      (select k, window_start, count(*) c from tumble(t1, ts, interval '1' minute) group by k, window_start) a
      join
      (select k, window_start, count(*) c from tumble(t2, ts, interval '1' minute) group by k, window_start) b
      on a.k = b.k and a.window_start = b.window_start;
  expected_outputs:
    - stream_plan
