- name: the hash join follows the distribution of an input that needs no provider.
  sql: |
    set enable_locality_backfill = true;
    set locality_backfill_mode = always;
    create table t1 (ts timestamp, k int, c int, v int, primary key (ts, k, c), watermark for ts as ts - interval '1' second with ttl);
    create table t2 (ts timestamp, k int, v int, watermark for ts as ts - interval '1' second) append only;
    select a.ts, a.k, a.s, t2.v from (select ts, k, sum(v) as s from t1 group by ts, k) a join t2 on a.k = t2.k and a.ts = t2.ts;
  expected_outputs:
    - stream_plan
- name: the hash join shuffles an input that needs no provider but is not hash distributed.
  sql: |
    set enable_locality_backfill = true;
    set locality_backfill_mode = always;
    create table t (a int, b int);
    create materialized view mv as select a, b from t order by a limit 10;
    create table u (x int, y int);
    select mv.a, mv.b, u.y from mv join u on mv.a = u.x;
  expected_outputs:
    - stream_plan
- name: an EOWC over window outputs rows in the order of the sort by time below it, so a provider above it.
  sql: |
    set enable_locality_backfill = true;
    set locality_backfill_mode = always;
    create table t (k int, ts timestamp, v int, watermark for ts as ts - interval '1' second) append only;
    select distinct on (k) k, ts, s from (select k, ts, sum(v) over (partition by k order by ts rows between 1 preceding and current row) as s from t);
  expected_outputs:
    - eowc_stream_plan
- name: an agg fed through a shuffle gets its own provider, and a join on its group key above it none.
  sql: |
    set enable_locality_backfill = true;
    set locality_backfill_mode = always;
    create table t (a int, b int, c int) append only;
    create table u (x int, y int);
    select x.a, x.cnt, u.y from (select a, count(*) as cnt from (select distinct on (a, b) a, b from t) group by a) x join u on x.a = u.x;
  expected_outputs:
    - stream_plan
- name: the dedup outputs rows in the order its provider replays them, so no provider for an agg on the same key above it.
  sql: |
    set enable_locality_backfill = true;
    set locality_backfill_mode = always;
    create table t (a int, b int, c int) append only;
    select a, b, count(*) from (select distinct on (a, b) a, b, c from t) group by a, b;
  expected_outputs:
    - stream_plan
- name: the provider replays rows in the lookup order of an index sharded by its first column, and is sharded like the index.
  sql: |
    set enable_locality_backfill = true;
    set locality_backfill_mode = always;
    create table s (a int, b int, c int);
    create table d (id int primary key, a int, b int, c int);
    create index idx on d(a, b) include (c);
    select s.a, s.b, s.c, d.c as dc from s join d for system_time as of proctime() on s.b = d.b and s.a = d.a;
  expected_outputs:
    - stream_plan
