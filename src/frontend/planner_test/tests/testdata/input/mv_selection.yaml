    create table t2_multi (b int, c int);
    create table t3_multi (c int, d int);
    create materialized view mv_multi_join as
      select a
      from t1_multi
      join t2_multi using (b)
      join t3_multi using (c);
    set enable_mv_selection = true;
    select a
    from t3_multi
    join t2_multi using (c)
