- name: dynamic state and configuration with a fixed question schema
  sql: |
    CREATE TABLE contexts (id INT, state JSONB, url VARCHAR, model VARCHAR, questions JSONB, api_key VARCHAR);
    SELECT id, ai_decide(state, url, model, ai_questions(ai_prob_question('q', 'Resolved?')), api_key) AS judgment FROM contexts;
  expected_outputs:
    - logical_plan
    - batch_plan
    - stream_plan
    - stream_dist_plan

- name: constants must not trigger inference during planning and key is redacted
  sql: |
    SELECT ai_decide('{"messages":["hello"]}'::jsonb, 'http://127.0.0.1:1/evaluate',
      'test-model', '{"q":{"type":"noul","instructions":"Resolved?"}}'::jsonb, 'planner-only-key');
  expected_outputs:
    - logical_plan
    - batch_plan
    - stream_plan

- name: nested expression materializes its old result
  sql: |
    CREATE TABLE contexts (id INT, state JSONB);
    SELECT id, coalesce((ai_decide(state, 'http://127.0.0.1:1/evaluate', 'test-model',
      ai_questions(ai_prob_question('q', 'Resolved?')), 'planner-only-key')).q, 0) AS answer FROM contexts;
  expected_outputs:
    - stream_plan

- name: grouped state is evaluated after aggregation
  sql: |
    CREATE TABLE events (user_id INT, seq INT, payload JSONB);
    SELECT user_id, ai_decide(jsonb_agg(payload ORDER BY seq),
      'http://127.0.0.1:1/evaluate', 'test-model', ai_questions(ai_prob_question('q', 'Resolved?')), 'planner-only-key')
    FROM events GROUP BY user_id;
  expected_outputs:
    - batch_plan
    - stream_plan

- name: windowed group supports immediate and on-close emission
  sql: |
    CREATE TABLE events (user_id INT, ts TIMESTAMP, payload JSONB,
      WATERMARK FOR ts AS ts - INTERVAL '5 seconds') APPEND ONLY;
    SELECT user_id, window_start, ai_decide(jsonb_agg(payload ORDER BY ts),
      'http://127.0.0.1:1/evaluate', 'test-model', ai_questions(ai_prob_question('q', 'Resolved?')), 'planner-only-key')
    FROM tumble(events, ts, INTERVAL '5 minutes') GROUP BY user_id, window_start;
  expected_outputs:
    - stream_plan
    - eowc_stream_plan

- name: OVER state is evaluated after the window for both emission modes
  sql: |
    CREATE TABLE events (user_id INT, ts TIMESTAMP, payload JSONB,
      WATERMARK FOR ts AS ts - INTERVAL '5 seconds') APPEND ONLY;
    SELECT user_id, ts, ai_decide(
      to_jsonb(array_agg(payload) OVER (PARTITION BY user_id ORDER BY ts ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)),
      'http://127.0.0.1:1/evaluate', 'test-model', ai_questions(ai_prob_question('q', 'Resolved?')), 'planner-only-key')
    FROM events;
  expected_outputs:
    - batch_plan
    - stream_plan
    - eowc_stream_plan

- name: append-only projection does not require result storage
  sql: |
    CREATE TABLE contexts (state JSONB, questions JSONB) APPEND ONLY;
    SELECT ai_decide(state, 'http://127.0.0.1:1/evaluate', 'test-model', ai_questions(ai_prob_question('q', 'Resolved?')), 'planner-only-key') FROM contexts;
  expected_outputs:
    - stream_plan

- name: wrong arity is rejected
  sql: SELECT ai_decide(ai_questions(ai_prob_question('q', 'Resolved?')), 'url', ai_questions(ai_prob_question('q', 'Resolved?')));
  expected_outputs:
    - binder_error

- name: mixed append-only projections isolate a shared conditional AI result
  sql: |
    CREATE TABLE contexts (id INT, state JSONB, enabled BOOLEAN) APPEND ONLY;
    SELECT id + 1 AS next_id, (answer).q AS first_read, (answer).q AS second_read
    FROM (
      SELECT id, CASE WHEN enabled THEN ai_decide(state, 'http://127.0.0.1:1/evaluate',
        'test-model', ai_questions(ai_prob_question('q', 'Resolved?')), 'planner-only-key') END AS answer
      FROM contexts
    ) e;
  expected_outputs:
    - stream_plan
    - stream_dist_plan

- name: wrong argument type is rejected
  sql: SELECT ai_decide(42, 'url', 'model', ai_questions(ai_prob_question('q', 'Resolved?')), 'planner-only-key');
  expected_outputs:
    - binder_error

- name: SECRET support is deferred
  sql: SELECT ai_decide(ai_questions(ai_prob_question('q', 'Resolved?')), 'url', 'model', ai_questions(ai_prob_question('q', 'Resolved?')), SECRET missing_key);
  expected_outputs:
    - binder_error

- name: sixth execution-options argument is rejected
  sql: |
    CREATE TABLE contexts (id INT, state JSONB);
    SELECT ai_decide(state, 'http://127.0.0.1:1/evaluate', 'test-model',
      ai_questions(ai_prob_question('q', 'Resolved?')), 'planner-only-key', '{"max_concurrency":16}'::jsonb) FROM contexts;
  expected_outputs:
    - binder_error

- name: mixed question constructors infer named nested fields
  sql: |
    CREATE TABLE contexts (id INT, state JSONB);
    WITH evaluated AS (
      SELECT id, ai_decide(state, 'http://127.0.0.1:1/evaluate', 'test-model',
        ai_questions(
          ai_prob_question('refund', 'Refund requested?'),
          ai_choice_question('team', 'Which team?', ARRAY[ai_option('billing', 'Payments and refunds'), ai_option('technical', 'Software issues')]),
          ai_score_question('urgency', 'How urgent?', ARRAY['Routine', 'Blocking'])
        ), 'planner-only-key') AS answer FROM contexts
    )
    SELECT id, (answer).refund, (answer).team.choice, (answer).team.confidence,
      (answer).team.probabilities['billing'] AS billing_probability, (answer).urgency.score,
      (answer).urgency.probabilities[1] AS low_probability FROM evaluated;
  expected_outputs:
    - logical_plan
    - batch_plan
    - stream_plan
    - stream_dist_plan

- name: constant expressions in questions are folded without inference
  sql: |
    SELECT ai_decide(NULL::jsonb, 'url', 'model',
      ai_questions(ai_prob_question('q', concat('Is ', 'resolved?'))), 'key');
  expected_outputs:
    - logical_plan

- name: dynamic questions are rejected
  sql: |
    CREATE TABLE contexts (state JSONB, questions JSONB);
    SELECT ai_decide(state, 'url', 'model', questions, 'key') FROM contexts;
  expected_outputs:
    - binder_error

- name: dynamic question text is rejected
  sql: |
    CREATE TABLE contexts (state JSONB, prompt VARCHAR);
    SELECT ai_decide(state, 'url', 'model', ai_prob_question('q', prompt), 'key') FROM contexts;
  expected_outputs:
    - binder_error

- name: duplicate question names are rejected
  sql: SELECT ai_questions(ai_prob_question('q', 'First?'), ai_prob_question('q', 'Second?'));
  expected_outputs:
    - binder_error

- name: duplicate choice labels are rejected
  sql: SELECT ai_choice_question('q', 'Choose?', ARRAY[ai_option('a', 'First'), ai_option('a', 'Second')]);
  expected_outputs:
    - binder_error

- name: empty question set is rejected
  sql: SELECT ai_questions();
  expected_outputs:
    - binder_error

- name: invalid score rubric is rejected
  sql: SELECT ai_score_question('q', 'Rate?', ARRAY['Only one level']);
  expected_outputs:
    - binder_error

- name: null option label is rejected
  sql: SELECT ai_option(NULL, 'Description');
  expected_outputs:
    - binder_error

- name: question types must be supported
  sql: SELECT ai_decide(NULL::jsonb, 'url', 'model', '{"q":{"type":"text","instructions":"Explain?"}}'::jsonb, 'key');
  expected_outputs:
    - binder_error

- name: optional header map supports row values and redacts credentials
  sql: |
    CREATE TABLE contexts (state JSONB, tenant VARCHAR);
    SELECT ai_decide(state, 'http://127.0.0.1:1/evaluate', 'test-model',
      ai_questions(ai_prob_question('q', 'Resolved?')), 'planner-only-key',
      MAP {'X-Tenant-ID': tenant, 'X-Api-Key': 'planner-header-secret'}) FROM contexts;
  expected_outputs:
    - logical_plan
    - batch_plan
    - stream_plan
    - stream_dist_plan

- name: header values must be strings
  sql: |
    SELECT ai_decide('{}'::jsonb, 'url', 'model',
      ai_questions(ai_prob_question('q', 'Resolved?')), 'key', MAP {'X-Tenant-ID': 42});
  expected_outputs:
    - binder_error

- name: header keys must be strings
  sql: |
    SELECT ai_decide('{}'::jsonb, 'url', 'model',
      ai_questions(ai_prob_question('q', 'Resolved?')), 'key', MAP {42: 'tenant'});
  expected_outputs:
    - binder_error

- name: more than six arguments is rejected
  sql: |
    SELECT ai_decide('{}'::jsonb, 'url', 'model',
      ai_questions(ai_prob_question('q', 'Resolved?')), 'key', MAP {'X-Tenant-ID': 'tenant'}, 1);
  expected_outputs:
    - binder_error
