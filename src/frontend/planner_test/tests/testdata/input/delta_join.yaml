- name: snapshot backfill skips delta join
  sql: |
    set rw_streaming_enable_delta_join = true;
    create table a (a1 int, a2 int);
    create index i_a1 on a(a1);
    create table b (b1 int, b2 int);
    create index i_b1 on b(b1);
    /* snapshot backfill should skip delta join */
    select * from a join b on a.a1 = b.b1 ;
  expected_outputs:
  - stream_plan
- sql: |
    set rw_streaming_enable_delta_join = true;
    set streaming_use_snapshot_backfill = false;
    create table a (a1 int, a2 int);
    create index i_a1 on a(a1);
    create table b (b1 int, b2 int);
    create index i_b1 on b(b1);
    /* should generate delta join plan, and stream index scan */
    select * from a join b on a.a1 = b.b1 ;
  expected_outputs:
  - stream_plan
- sql: |
    set rw_streaming_enable_delta_join = true;
    set streaming_use_snapshot_backfill = false;
    create table a (a1 int primary key, a2 int);
    create table b (b1 int, b2 int);
    create index i_b1 on b(b1);
    /* should generate delta join plan, and stream index scan */
    select * from a join b on a.a1 = b.b1 ;
  expected_outputs:
  - stream_plan
- sql: |
    set rw_streaming_enable_delta_join = true;
    set streaming_use_snapshot_backfill = false;
    create table a (a1 int primary key, a2 int);
    create table b (b1 int primary key, b2 int);
    /* should generate delta join plan, and stream index scan */
    select * from a join b on a.a1 = b.b1 ;
  expected_outputs:
  - stream_plan
- name: unaligned delta join
  sql: |
    set rw_streaming_enable_delta_join = true;
    set streaming_use_snapshot_backfill = false;
    set streaming_enable_unaligned_join = true;
    create table a (a1 int primary key, a2 int);
    create table b (b1 int primary key, b2 int);
    /* should generate delta join plan, and stream index scan */
    select * from a join b on a.a1 = b.b1 ;
  expected_outputs:
  - stream_plan
- name: delta join does not use an index that lacks a column of the scan
  sql: |
    set rw_streaming_enable_delta_join = true;
    set streaming_use_snapshot_backfill = false;
    create table a (a1 int, a2 int);
    create index i_a1 on a(a1);
    create table c (id int primary key, x int, v int);
    /* `i_c` has as many columns as `c`, but not `v`. */
    create index i_c on c(x, abs(x)) include (id);
    select a.a2, c.v from a join c on a.a1 = c.x;
  expected_outputs:
  - stream_plan
